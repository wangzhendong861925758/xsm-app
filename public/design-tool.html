<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 精准标注工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
  .topbar h1 { font-size: 16px; color: #e94560; white-space: nowrap; }
  .topbar button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; }
  .topbar button:hover { background: #1a4a7a; }
  .topbar .info { font-size: 12px; color: #888; margin-left: auto; }
  .topbar .zoom { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .topbar .zoom input { width: 120px; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .canvas-area { flex: 1; overflow: auto; background: #0d1117; position: relative; display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
  .canvas-wrap { position: relative; display: inline-block; }
  #imgCanvas { display: block; border: 1px solid #333; cursor: crosshair; }
  #overlayCanvas { position: absolute; top: 0; left: 0; pointer-events: auto; }
  .upload-zone { width: 400px; height: 200px; border: 2px dashed #333; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: auto; cursor: pointer; transition: all .2s; }
  .upload-zone:hover { border-color: #e94560; background: rgba(233,69,96,0.05); }
  .upload-zone p { color: #666; font-size: 14px; }
  .upload-zone .icon { font-size: 40px; }
  .sidebar { width: 400px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-section { padding: 12px 16px; border-bottom: 1px solid #0f3460; }
  .sidebar-section h3 { font-size: 13px; color: #e94560; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .mode-tabs { display: flex; gap: 4px; }
  .mode-tabs button { flex: 1; padding: 8px; background: #0f3460; border: 1px solid #1a4a7a; color: #888; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .2s; }
  .mode-tabs button.active { background: #e94560; border-color: #e94560; color: #fff; }
  .live-data { font-size: 12px; line-height: 1.8; }
  .live-data .row { display: flex; justify-content: space-between; align-items: center; }
  .live-data .label { color: #888; }
  .live-data .value { color: #4ecca3; font-family: "Cascadia Code", "Consolas", monospace; }
  .color-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #555; vertical-align: middle; margin-right: 4px; }
  .annotations { flex: 1; overflow-y: auto; padding: 0; }
  .annotation-item { padding: 10px 16px; border-bottom: 1px solid #0f3460; font-size: 12px; cursor: pointer; transition: background .15s; }
  .annotation-item:hover { background: rgba(15,52,96,0.5); }
  .annotation-item .name { color: #e0e0e0; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .annotation-item .name .del { color: #e94560; cursor: pointer; font-size: 14px; }
  .annotation-item .data { color: #888; font-family: "Cascadia Code", "Consolas", monospace; font-size: 11px; line-height: 1.7; }
  .annotation-item .data .key { color: #4ecca3; }
  .annotation-item .data .section { color: #e94560; margin-top: 4px; font-weight: 600; }
  .annotation-item .data .color-line { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
  .annotation-item .data .pct { color: #888; font-size: 10px; }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
  .sidebar-footer button { flex: 1; padding: 8px; font-size: 12px; border-radius: 6px; cursor: pointer; border: 1px solid #1a4a7a; background: #0f3460; color: #e0e0e0; transition: all .2s; }
  .sidebar-footer button:hover { background: #1a4a7a; }
  .sidebar-footer button.export { background: #4ecca3; border-color: #4ecca3; color: #0d1117; font-weight: 600; }
  .sidebar-footer button.export:hover { background: #3db88a; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e94560; color: #fff; padding: 8px 20px; border-radius: 8px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .name-input-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 20px; z-index: 1000; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .name-input-overlay.show { display: block; }
  .name-input-overlay h3 { color: #e94560; font-size: 14px; margin-bottom: 12px; }
  .name-input-overlay input { width: 280px; padding: 8px 12px; background: #0d1117; border: 1px solid #1a4a7a; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
  .name-input-overlay input:focus { border-color: #e94560; }
  .name-input-overlay .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
  .name-input-overlay button { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; border: none; }
  .name-input-overlay .confirm { background: #e94560; color: #fff; }
  .name-input-overlay .cancel { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a7a; }
  .analyzing { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 30px 40px; z-index: 999; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center; }
  .analyzing.show { display: block; }
  .analyzing .spinner { width: 36px; height: 36px; border: 3px solid #0f3460; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .analyzing p { color: #888; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>UI 精准标注工具</h1>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <button onclick="document.getElementById('fileInput').click()">上传图片</button>
  <div class="zoom">
    <span>缩放</span>
    <input type="range" id="zoomSlider" min="0.2" max="4" step="0.1" value="1">
    <span id="zoomValue">100%</span>
  </div>
  <div class="info" id="imgInfo">未加载图片</div>
</div>

<div class="main">
  <div class="canvas-area" id="canvasArea">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📷</div>
      <p>点击或拖拽上传 App 截图</p>
      <p style="font-size:12px;color:#555">框选区域后自动分析：颜色/形状/边框/圆角/渐变/文字特征</p>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none">
      <canvas id="imgCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <h3>操作模式</h3>
      <div class="mode-tabs">
        <button class="active" data-mode="measure" onclick="setMode('measure')">框选分析</button>
        <button data-mode="color" onclick="setMode('color')">点击取色</button>
        <button data-mode="auto" onclick="setMode('auto')">整页扫描</button>
      </div>
      <p style="font-size:11px;color:#666;margin-top:6px" id="modeHint">拖拽框选区域，自动分析该区域内所有视觉特征</p>
    </div>

    <div class="sidebar-section">
      <h3>实时数据</h3>
      <div class="live-data" id="liveData">
        <div class="row"><span class="label">坐标 X,Y</span><span class="value" id="liveXY">—</span></div>
        <div class="row"><span class="label">选区 W×H</span><span class="value" id="liveWH">—</span></div>
        <div class="row"><span class="label">选区位置</span><span class="value" id="livePos">—</span></div>
        <div class="row"><span class="label">像素颜色</span><span class="value" id="liveColor">—</span></div>
        <div class="row"><span class="label">平均色</span><span class="value" id="liveAvgColor">—</span></div>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;padding:0">
      <div style="padding:12px 16px 8px"><h3>标注列表 (<span id="annoCount">0</span>)</h3></div>
      <div class="annotations" id="annoList">
        <p style="padding:16px;color:#555;font-size:12px;text-align:center">暂无标注，请在图片上框选或取色</p>
      </div>
    </div>

    <div class="sidebar-footer">
      <button onclick="clearAll()">清空</button>
      <button onclick="copyJSON()">复制JSON</button>
      <button class="export" onclick="exportJSON()">导出JSON</button>
    </div>
  </div>
</div>

<div class="name-input-overlay" id="nameOverlay">
  <h3 id="nameOverlayTitle">为标注命名</h3>
  <div id="namePreview" style="font-size:11px;color:#888;margin-bottom:10px;font-family:monospace;max-height:200px;overflow-y:auto"></div>
  <input type="text" id="nameInput" placeholder="例如：标题文字 / 卡片背景 / 图标" autocomplete="off">
  <div class="actions">
    <button class="cancel" onclick="cancelName()">取消</button>
    <button class="confirm" onclick="confirmName()">确认</button>
  </div>
</div>

<div class="analyzing" id="analyzing">
  <div class="spinner"></div>
  <p id="analyzingText">分析中...</p>
</div>

<div class="toast" id="toast"></div>

<script>
const imgCanvas = document.getElementById('imgCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const imgCtx = imgCanvas.getContext('2d', { willReadFrequently: true });
const overlayCtx = overlayCanvas.getContext('2d');

let img = null;
let zoom = 1;
let mode = 'measure';
let isDrawing = false;
let startX = 0, startY = 0, endX = 0, endY = 0;
let mouseX = 0, mouseY = 0;
let annotations = [];
let pendingAnnotation = null;

// ========== 图片上传 ==========
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    img = new Image();
    img.onload = () => {
      document.getElementById('uploadZone').style.display = 'none';
      document.getElementById('canvasWrap').style.display = 'inline-block';
      document.getElementById('imgInfo').textContent = `${img.width} × ${img.height}px`;
      renderCanvas();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); });
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    document.getElementById('fileInput').files = e.dataTransfer.files;
    document.getElementById('fileInput').dispatchEvent(new Event('change'));
  }
});

document.getElementById('zoomSlider').addEventListener('input', (e) => {
  zoom = parseFloat(e.target.value);
  document.getElementById('zoomValue').textContent = Math.round(zoom * 100) + '%';
  renderCanvas();
});

function renderCanvas() {
  if (!img) return;
  const w = Math.round(img.width * zoom);
  const h = Math.round(img.height * zoom);
  imgCanvas.width = w;
  imgCanvas.height = h;
  overlayCanvas.width = w;
  overlayCanvas.height = h;
  overlayCanvas.style.width = w + 'px';
  overlayCanvas.style.height = h + 'px';
  imgCtx.drawImage(img, 0, 0, w, h);
  drawAnnotations();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-mode="${m}"]`).classList.add('active');
  const hints = {
    measure: '拖拽框选区域，自动分析该区域内所有视觉特征',
    color: '点击图片任意位置取该点像素颜色',
    auto: '自动扫描整页，检测所有色块边界和元素'
  };
  document.getElementById('modeHint').textContent = hints[m];
  imgCanvas.style.cursor = m === 'color' ? 'pointer' : 'crosshair';
}

// ========== 鼠标事件 ==========
overlayCanvas.addEventListener('mousedown', onMouseDown);
overlayCanvas.addEventListener('mousemove', onMouseMove);
overlayCanvas.addEventListener('mouseup', onMouseUp);
overlayCanvas.addEventListener('mouseleave', () => {
  document.getElementById('liveXY').textContent = '—';
  clearOverlay();
  drawAnnotations();
});

function getMousePos(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - rect.left) * (overlayCanvas.width / rect.width)),
    y: Math.round((e.clientY - rect.top) * (overlayCanvas.height / rect.height))
  };
}

function onMouseDown(e) {
  if (!img) return;
  const pos = getMousePos(e);

  if (mode === 'color') {
    const pixel = imgCtx.getImageData(pos.x, pos.y, 1, 1).data;
    const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
    pendingAnnotation = {
      type: 'color',
      x: pos.x, y: pos.y,
      realX: Math.round(pos.x / zoom),
      realY: Math.round(pos.y / zoom),
      color: hex,
      rgba: `rgba(${pixel[0]},${pixel[1]},${pixel[2]},${pixel[3]})`
    };
    showNameInput(`颜色 ${hex}`, formatColorPreview(pendingAnnotation));
    return;
  }

  if (mode === 'auto') {
    // 整页扫描
    autoScanPage();
    return;
  }

  isDrawing = true;
  startX = pos.x;
  startY = pos.y;
  endX = pos.x;
  endY = pos.y;
}

function onMouseMove(e) {
  if (!img) return;
  const pos = getMousePos(e);
  mouseX = pos.x;
  mouseY = pos.y;

  const rx = Math.round(pos.x / zoom);
  const ry = Math.round(pos.y / zoom);
  document.getElementById('liveXY').textContent = `${rx}, ${ry}`;

  if (pos.x >= 0 && pos.y >= 0 && pos.x < imgCanvas.width && pos.y < imgCanvas.height) {
    const pixel = imgCtx.getImageData(pos.x, pos.y, 1, 1).data;
    const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
    document.getElementById('liveColor').innerHTML = `<span class="color-swatch" style="background:${hex}"></span>${hex}`;
  }

  if (mode === 'measure' && isDrawing) {
    endX = pos.x;
    endY = pos.y;
    drawSelection();
    updateLiveData();
  } else if (mode !== 'auto') {
    drawCrosshair();
  }
}

function onMouseUp(e) {
  if (!img || mode !== 'measure' || !isDrawing) return;
  isDrawing = false;

  const x = Math.min(startX, endX);
  const y = Math.min(startY, endY);
  const w = Math.abs(endX - startX);
  const h = Math.abs(endY - startY);

  if (w < 3 || h < 3) {
    clearOverlay();
    drawAnnotations();
    return;
  }

  // 显示分析中
  showAnalyzing('正在分析选区...');
  
  // 异步分析
  setTimeout(() => {
    const analysis = analyzeRegion(x, y, w, h);
    hideAnalyzing();

    pendingAnnotation = analysis;
    const preview = formatAnalysisPreview(analysis);
    showNameInput(`${analysis.width}×${analysis.height}`, preview);
  }, 50);
}

function updateLiveData() {
  const x = Math.min(startX, endX);
  const y = Math.min(startY, endY);
  const w = Math.abs(endX - startX);
  const h = Math.abs(endY - startY);
  const rw = Math.round(w / zoom);
  const rh = Math.round(h / zoom);
  const rx = Math.round(x / zoom);
  const ry = Math.round(y / zoom);

  document.getElementById('liveWH').textContent = `${rw} × ${rh}px`;
  document.getElementById('livePos').textContent = `${rx}, ${ry}`;

  if (w > 0 && h > 0) {
    const avg = getAvgColor(x, y, w, h);
    const hex = rgbToHex(avg.r, avg.g, avg.b);
    document.getElementById('liveAvgColor').innerHTML = `<span class="color-swatch" style="background:${hex}"></span>${hex}`;
  }
}

// ========== 核心分析引擎 ==========

function analyzeRegion(sx, sy, sw, sh) {
  const imageData = imgCtx.getImageData(sx, sy, sw, sh);
  const data = imageData.data;
  const w = sw, h = sh;

  // 转换到原始坐标
  const realX = Math.round(sx / zoom);
  const realY = Math.round(sy / zoom);
  const realW = Math.round(w / zoom);
  const realH = Math.round(h / zoom);

  // 1. 主色调提取（颜色量化）
  const palette = extractPalette(data, 8);

  // 2. 背景色检测（四角众数）
  const bgColor = detectBgColor(data, w, h);

  // 3. 圆角检测
  const cornerRadius = detectCornerRadius(data, w, h, bgColor);

  // 4. 边框检测
  const border = detectBorder(data, w, h, bgColor);

  // 5. 渐变检测
  const gradient = detectGradient(data, w, h);

  // 6. 文字特征检测
  const textFeature = detectTextFeature(data, w, h, bgColor);

  // 7. 内容自适应边界（裁剪到实际内容）
  const contentBounds = findContentBounds(data, w, h, bgColor);

  // 8. 对称性检测
  const symmetry = detectSymmetry(data, w, h);

  // 9. 亮度分析
  const brightness = analyzeBrightness(data);

  // 10. 颜色分布统计
  const colorDistribution = analyzeColorDistribution(data, bgColor);

  return {
    type: 'measure',
    x: realX, y: realY,
    width: realW, height: realH,
    aspectRatio: (realW / realH).toFixed(2),
    palette,
    bgColor,
    cornerRadius,
    border,
    gradient,
    textFeature,
    contentBounds: contentBounds ? {
      x: realX + contentBounds.x,
      y: realY + contentBounds.y,
      width: contentBounds.width,
      height: contentBounds.height,
      padding: {
        top: contentBounds.y,
        right: w - contentBounds.x - contentBounds.width,
        bottom: h - contentBounds.y - contentBounds.height,
        left: contentBounds.x
      }
    } : null,
    symmetry,
    brightness,
    colorDistribution,
    pixelCount: w * h
  };
}

// 颜色量化：提取主色调
function extractPalette(data, maxColors) {
  const colorMap = new Map();
  const step = 4; // 采样步长，加速
  
  for (let i = 0; i < data.length; i += step * 4) {
    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];
    const a = data[i + 3];
    if (a < 128) continue;
    
    // 量化到 5-bit 精度
    const qr = r >> 4 << 4;
    const qg = g >> 4 << 4;
    const qb = b >> 4 << 4;
    const key = `${qr},${qg},${qb}`;
    
    if (colorMap.has(key)) {
      const entry = colorMap.get(key);
      entry.count++;
      entry.r += r;
      entry.g += g;
      entry.b += b;
    } else {
      colorMap.set(key, { count: 1, r, g, b });
    }
  }
  
  const total = [...colorMap.values()].reduce((s, e) => s + e.count, 0);
  const sorted = [...colorMap.entries()]
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, maxColors)
    .map(([key, entry]) => {
      const r = Math.round(entry.r / entry.count);
      const g = Math.round(entry.g / entry.count);
      const b = Math.round(entry.b / entry.count);
      return {
        hex: rgbToHex(r, g, b),
        rgb: `rgb(${r},${g},${b})`,
        ratio: (entry.count / total * 100).toFixed(1) + '%'
      };
    });
  
  return sorted;
}

// 背景色检测：四角+边缘众数
function detectBgColor(data, w, h) {
  const corners = [];
  const samples = Math.min(5, Math.floor(w / 4), Math.floor(h / 4));
  
  // 四角采样
  for (let i = 0; i < samples; i++) {
    // 左上
    corners.push(getPixel(data, w, i, i));
    // 右上
    corners.push(getPixel(data, w, w - 1 - i, i));
    // 左下
    corners.push(getPixel(data, w, i, h - 1 - i));
    // 右下
    corners.push(getPixel(data, w, w - 1 - i, h - 1 - i));
  }
  
  // 边缘采样
  const edgeStep = Math.max(1, Math.floor(w / 20));
  for (let x = 0; x < w; x += edgeStep) {
    corners.push(getPixel(data, w, x, 0));
    corners.push(getPixel(data, w, x, h - 1));
  }
  for (let y = 0; y < h; y += edgeStep) {
    corners.push(getPixel(data, w, 0, y));
    corners.push(getPixel(data, w, w - 1, y));
  }
  
  // 量化后找众数
  const map = new Map();
  corners.forEach(c => {
    const qr = c.r >> 4 << 4;
    const qg = c.g >> 4 << 4;
    const qb = c.b >> 4 << 4;
    const key = `${qr},${qg},${qb}`;
    if (map.has(key)) {
      map.get(key).count++;
      map.get(key).r += c.r;
      map.get(key).g += c.g;
      map.get(key).b += c.b;
    } else {
      map.set(key, { count: 1, r: c.r, g: c.g, b: c.b });
    }
  });
  
  const best = [...map.values()].sort((a, b) => b.count - a.count)[0];
  if (!best) return '#FFFFFF';
  return rgbToHex(
    Math.round(best.r / best.count),
    Math.round(best.g / best.count),
    Math.round(best.b / best.count)
  );
}

function getPixel(data, w, x, y) {
  const idx = (y * w + x) * 4;
  return { r: data[idx], g: data[idx + 1], b: data[idx + 2], a: data[idx + 3] };
}

function colorDist(a, b) {
  return Math.sqrt(
    Math.pow(a.r - b.r, 2) +
    Math.pow(a.g - b.g, 2) +
    Math.pow(a.b - b.b, 2)
  );
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

// 圆角检测
function detectCornerRadius(data, w, h, bgColorHex) {
  const bg = hexToRgb(bgColorHex);
  const tol = 30;
  
  // 检测左上角圆角：从角点向内扫描
  function scanCorner(cornerX, cornerY, dirX, dirY) {
    let maxRadius = 0;
    const maxScan = Math.min(Math.floor(w / 3), Math.floor(h / 3), 50);
    
    for (let r = 1; r <= maxScan; r++) {
      // 在半径 r 的弧上采样
      let allBg = true;
      const samples = Math.max(8, r * 2);
      for (let i = 0; i <= samples; i++) {
        const angle = (i / samples) * (Math.PI / 2);
        const dx = Math.round(r * Math.cos(angle) * dirX);
        const dy = Math.round(r * Math.sin(angle) * dirY);
        const px = cornerX + dx;
        const py = cornerY + dy;
        if (px < 0 || px >= w || py < 0 || py >= h) continue;
        const c = getPixel(data, w, px, py);
        if (colorDist(c, bg) > tol) {
          allBg = false;
          break;
        }
      }
      if (allBg) maxRadius = r;
      else break;
    }
    return maxRadius;
  }
  
  const tl = scanCorner(0, 0, 1, 1);
  const tr = scanCorner(w - 1, 0, -1, 1);
  const bl = scanCorner(0, h - 1, 1, -1);
  const br = scanCorner(w - 1, h - 1, -1, -1);
  
  const radii = [tl, tr, bl, br].filter(r => r > 0);
  if (radii.length === 0) return { detected: false, radius: 0 };
  
  const avg = Math.round(radii.reduce((a, b) => a + b, 0) / radii.length);
  const uniform = radii.every(r => Math.abs(r - avg) <= 2);
  
  return {
    detected: true,
    radius: Math.round(avg / zoom),
    corners: { tl: Math.round(tl / zoom), tr: Math.round(tr / zoom), bl: Math.round(bl / zoom), br: Math.round(br / zoom) },
    uniform
  };
}

// 边框检测
function detectBorder(data, w, h, bgColorHex) {
  const bg = hexToRgb(bgColorHex);
  const tol = 25;
  
  function scanEdge(axis, pos) {
    // 扫描一条边，找到第一个非背景色像素的距离
    const len = axis === 'x' ? h : w;
    const depth = axis === 'x' ? w : h;
    let minDist = depth;
    let borderColor = null;
    
    const sampleStep = Math.max(1, Math.floor(len / 30));
    for (let i = 0; i < len; i += sampleStep) {
      for (let d = 0; d < Math.min(depth, 20); d++) {
        const x = axis === 'x' ? d : i;
        const y = axis === 'x' ? i : d;
        if (x >= w || y >= h) break;
        const c = getPixel(data, w, x, y);
        if (colorDist(c, bg) > tol) {
          if (d < minDist) {
            minDist = d;
            borderColor = rgbToHex(c.r, c.g, c.b);
          }
          break;
        }
      }
    }
    return { width: minDist >= 20 ? 0 : Math.round(minDist / zoom), color: borderColor };
  }
  
  const top = scanEdge('y', 0);
  const left = scanEdge('x', 0);
  
  if (top.width === 0 && left.width === 0) return { detected: false };
  
  return {
    detected: true,
    topWidth: top.width,
    leftWidth: left.width,
    color: top.color || left.color
  };
}

// 渐变检测
function detectGradient(data, w, h) {
  const samples = 10;
  const colorsH = [];
  const colorsV = [];
  
  for (let i = 0; i <= samples; i++) {
    // 水平采样（中间行）
    const x = Math.floor((i / samples) * (w - 1));
    const y = Math.floor(h / 2);
    colorsH.push(getPixel(data, w, x, y));
    // 垂直采样（中间列）
    const x2 = Math.floor(w / 2);
    const y2 = Math.floor((i / samples) * (h - 1));
    colorsV.push(getPixel(data, w, x2, y2));
  }
  
  // 计算色差变化
  let hDiff = 0, vDiff = 0;
  for (let i = 1; i < colorsH.length; i++) {
    hDiff += colorDist(colorsH[i], colorsH[0]);
  }
  for (let i = 1; i < colorsV.length; i++) {
    vDiff += colorDist(colorsV[i], colorsV[0]);
  }
  
  hDiff /= colorsH.length;
  vDiff /= colorsV.length;
  
  const threshold = 15;
  
  if (hDiff > threshold && hDiff > vDiff) {
    return {
      detected: true,
      direction: 'horizontal',
      from: rgbToHex(colorsH[0].r, colorsH[0].g, colorsH[0].b),
      to: rgbToHex(colorsH[colorsH.length-1].r, colorsH[colorsH.length-1].g, colorsH[colorsH.length-1].b),
      variation: Math.round(hDiff)
    };
  } else if (vDiff > threshold) {
    return {
      detected: true,
      direction: 'vertical',
      from: rgbToHex(colorsV[0].r, colorsV[0].g, colorsV[0].b),
      to: rgbToHex(colorsV[colorsV.length-1].r, colorsV[colorsV.length-1].g, colorsV[colorsV.length-1].b),
      variation: Math.round(vDiff)
    };
  }
  
  return { detected: false };
}

// 文字特征检测
function detectTextFeature(data, w, h, bgColorHex) {
  const bg = hexToRgb(bgColorHex);
  const tol = 40;
  
  // 统计非背景色像素的比例和分布
  let nonBgPixels = 0;
  let nonBgColors = new Map();
  const rows = new Array(h).fill(0);
  const cols = new Array(w).fill(0);
  
  const step = 2;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const c = getPixel(data, w, x, y);
      if (colorDist(c, bg) > tol) {
        nonBgPixels++;
        rows[y] = 1;
        cols[x] = 1;
        const key = rgbToHex(c.r, c.g, c.b);
        nonBgColors.set(key, (nonBgColors.get(key) || 0) + 1);
      }
    }
  }
  
  const totalSampled = Math.ceil(w / step) * Math.ceil(h / step);
  const ratio = nonBgPixels / totalSampled;
  
  // 文字特征：非背景色占比通常在 5%-40%，且颜色集中
  const topColors = [...nonBgColors.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
  const topColorRatio = topColors.length > 0 ? topColors[0][1] / nonBgPixels : 0;
  
  // 检测行密度变化（文字通常有水平条纹特征）
  let rowChanges = 0;
  for (let y = 1; y < h; y += step) {
    if (rows[y] !== rows[y - step]) rowChanges++;
  }
  
  const isText = ratio > 0.02 && ratio < 0.5 && topColorRatio > 0.3 && rowChanges > 3;
  
  return {
    hasContent: nonBgPixels > 5,
    contentRatio: (ratio * 100).toFixed(1) + '%',
    likelyText: isText,
    contentColors: topColors.map(([hex, count]) => ({
      hex,
      ratio: (count / nonBgPixels * 100).toFixed(1) + '%'
    })),
    rowChanges
  };
}

// 内容自适应边界
function findContentBounds(data, w, h, bgColorHex) {
  const bg = hexToRgb(bgColorHex);
  const tol = 25;
  
  let minX = w, minY = h, maxX = -1, maxY = -1;
  const step = 2;
  
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const c = getPixel(data, w, x, y);
      if (colorDist(c, bg) > tol) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  
  if (maxX < 0) return null;
  
  return {
    x: Math.round(minX / zoom),
    y: Math.round(minY / zoom),
    width: Math.round((maxX - minX) / zoom),
    height: Math.round((maxY - minY) / zoom)
  };
}

// 对称性检测
function detectSymmetry(data, w, h) {
  const step = 3;
  let hMatch = 0, hTotal = 0;
  let vMatch = 0, vTotal = 0;
  
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w / 2; x += step) {
      const cl = getPixel(data, w, x, y);
      const cr = getPixel(data, w, w - 1 - x, y);
      if (colorDist(cl, cr) < 20) hMatch++;
      hTotal++;
    }
  }
  
  for (let x = 0; x < w; x += step) {
    for (let y = 0; y < h / 2; y += step) {
      const ct = getPixel(data, w, x, y);
      const cb = getPixel(data, w, x, h - 1 - y);
      if (colorDist(ct, cb) < 20) vMatch++;
      vTotal++;
    }
  }
  
  return {
    horizontal: (hMatch / hTotal * 100).toFixed(0) + '%',
    vertical: (vMatch / vTotal * 100).toFixed(0) + '%'
  };
}

// 亮度分析
function analyzeBrightness(data) {
  let sum = 0, count = 0;
  const step = 4;
  let min = 255, max = 0;
  
  for (let i = 0; i < data.length; i += step * 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    sum += lum;
    if (lum < min) min = lum;
    if (lum > max) max = lum;
    count++;
  }
  
  const avg = sum / count;
  return {
    average: Math.round(avg),
    min: Math.round(min),
    max: Math.round(max),
    level: avg > 180 ? 'bright' : avg > 100 ? 'medium' : 'dark'
  };
}

// 颜色分布
function analyzeColorDistribution(data, bgColorHex) {
  const bg = hexToRgb(bgColorHex);
  const tol = 30;
  const step = 4;
  
  let bgCount = 0, fgCount = 0, totalCount = 0;
  const hueBuckets = new Array(12).fill(0);
  
  for (let i = 0; i < data.length; i += step * 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    totalCount++;
    
    if (colorDist({r, g, b}, bg) < tol) {
      bgCount++;
    } else {
      fgCount++;
      const hue = rgbToHue(r, g, b);
      hueBuckets[Math.floor(hue / 30)]++;
    }
  }
  
  return {
    bgRatio: (bgCount / totalCount * 100).toFixed(1) + '%',
    fgRatio: (fgCount / totalCount * 100).toFixed(1) + '%',
    dominantHue: hueBuckets.indexOf(Math.max(...hueBuckets)) * 30 + '°-' + (hueBuckets.indexOf(Math.max(...hueBuckets)) + 1) * 30 + '°'
  };
}

function rgbToHue(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max === min) return 0;
  const d = max - min;
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return h * 360;
}

function getAvgColor(x, y, w, h) {
  const data = imgCtx.getImageData(x, y, w, h).data;
  let r = 0, g = 0, b = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
  }
  return { r: Math.round(r / count), g: Math.round(g / count), b: Math.round(b / count) };
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(c => Math.max(0, Math.min(255, c)).toString(16).padStart(2, '0')).join('').toUpperCase();
}

// ========== 整页自动扫描 ==========
function autoScanPage() {
  if (!img) return;
  showAnalyzing('正在扫描整页...');
  
  setTimeout(() => {
    const w = imgCanvas.width;
    const h = imgCanvas.height;
    const imageData = imgCtx.getImageData(0, 0, w, h);
    const data = imageData.data;
    
    // 行扫描：检测颜色突变的行（可能是元素边界）
    const rowColors = [];
    const rowStep = Math.max(1, Math.floor(h / 200));
    for (let y = 0; y < h; y += rowStep) {
      let r = 0, g = 0, b = 0, count = 0;
      const xStep = Math.max(1, Math.floor(w / 50));
      for (let x = 0; x < w; x += xStep) {
        const idx = (y * w + x) * 4;
        r += data[idx]; g += data[idx + 1]; b += data[idx + 2]; count++;
      }
      rowColors.push({ y, color: { r: r/count, g: g/count, b: b/count } });
    }
    
    // 找颜色突变点
    const breaks = [];
    for (let i = 1; i < rowColors.length; i++) {
      const diff = colorDist(rowColors[i].color, rowColors[i-1].color);
      if (diff > 30) {
        breaks.push({ y: rowColors[i].y, diff: Math.round(diff) });
      }
    }
    
    // 生成区域列表
    const regions = [];
    if (breaks.length > 0) {
      let prevY = 0;
      for (const b of breaks) {
        regions.push({ y1: prevY, y2: b.y });
        prevY = b.y;
      }
      regions.push({ y1: prevY, y2: h });
    }
    
    hideAnalyzing();
    
    // 在画布上绘制扫描结果
    clearOverlay();
    drawAnnotations();
    
    overlayCtx.strokeStyle = '#e94560';
    overlayCtx.lineWidth = 1;
    overlayCtx.setLineDash([8, 4]);
    breaks.forEach(b => {
      overlayCtx.beginPath();
      overlayCtx.moveTo(0, b.y);
      overlayCtx.lineTo(w, b.y);
      overlayCtx.stroke();
      
      overlayCtx.fillStyle = 'rgba(233,69,96,0.9)';
      overlayCtx.fillRect(4, b.y - 14, 80, 14);
      overlayCtx.fillStyle = '#fff';
      overlayCtx.font = '10px monospace';
      overlayCtx.fillText(`y=${Math.round(b.y/zoom)} Δ=${b.diff}`, 8, b.y - 3);
    });
    overlayCtx.setLineDash([]);
    
    // 显示扫描结果
    const scanResult = {
      type: 'scan',
      name: '整页扫描结果',
      breaks: breaks.map(b => ({ y: Math.round(b.y / zoom), colorDiff: b.diff })),
      regions: regions.map(r => ({ y1: Math.round(r.y1 / zoom), y2: Math.round(r.y2 / zoom), height: Math.round((r.y2 - r.y1) / zoom) })),
      totalBreaks: breaks.length
    };
    
    pendingAnnotation = scanResult;
    showNameInput('整页扫描', formatScanPreview(scanResult));
  }, 50);
}

// ========== 格式化预览 ==========
function formatAnalysisPreview(a) {
  let html = '';
  html += `<div class="section">📍 位置与尺寸</div>`;
  html += `x=${a.x}, y=${a.y} | ${a.width}×${a.height}px | ratio=${a.aspectRatio}<br>`;
  
  if (a.contentBounds) {
    html += `<div class="section">📐 内容边界（自动裁剪）</div>`;
    html += `内容: ${a.contentBounds.width}×${a.contentBounds.height}px @ (${a.contentBounds.x},${a.contentBounds.y})<br>`;
    html += `padding: T=${a.contentBounds.padding.top} R=${a.contentBounds.padding.right} B=${a.contentBounds.padding.bottom} L=${a.contentBounds.padding.left}<br>`;
  }
  
  html += `<div class="section">🎨 主色调 (${a.palette.length})</div>`;
  a.palette.forEach(c => {
    html += `<div class="color-line"><span class="color-swatch" style="background:${c.hex}"></span>${c.hex} <span class="pct">${c.ratio}</span></div>`;
  });
  
  html += `<div class="section">🏳️ 背景色</div>`;
  html += `${a.bgColor}<br>`;
  
  if (a.cornerRadius.detected) {
    html += `<div class="section">🔄 圆角</div>`;
    html += `半径≈${a.cornerRadius.radius}px | 四角: ${a.cornerRadius.corners.tl}/${a.cornerRadius.corners.tr}/${a.cornerRadius.corners.bl}/${a.cornerRadius.corners.br}<br>`;
  }
  
  if (a.border.detected) {
    html += `<div class="section">🔲 边框</div>`;
    html += `上=${a.border.topWidth}px 左=${a.border.leftWidth}px | 色=${a.border.color}<br>`;
  }
  
  if (a.gradient.detected) {
    html += `<div class="section">🌈 渐变 (${a.gradient.direction})</div>`;
    html += `${a.gradient.from} → ${a.gradient.to} | 变化=${a.gradient.variation}<br>`;
  }
  
  if (a.textFeature.hasContent) {
    html += `<div class="section">📝 内容特征</div>`;
    html += `内容占比=${a.textFeature.contentRatio}`;
    if (a.textFeature.likelyText) html += ` | ⚠️疑似文字`;
    html += `<br>`;
    if (a.textFeature.contentColors.length > 0) {
      html += `文字色: `;
      a.textFeature.contentColors.forEach(c => {
        html += `<span class="color-swatch" style="background:${c.hex}"></span>${c.hex}(${c.ratio}) `;
      });
      html += '<br>';
    }
  }
  
  html += `<div class="section">💡 亮度</div>`;
  html += `avg=${a.brightness.average} min=${a.brightness.min} max=${a.brightness.max} (${a.brightness.level})<br>`;
  
  html += `<div class="section">🔀 对称性</div>`;
  html += `水平=${a.symmetry.horizontal} 垂直=${a.symmetry.vertical}<br>`;
  
  html += `<div class="section">📊 颜色分布</div>`;
  html += `背景=${a.colorDistribution.bgRatio} 前景=${a.colorDistribution.fgRatio} | 主色相=${a.colorDistribution.dominantHue}<br>`;
  
  return html;
}

function formatColorPreview(a) {
  return `<span class="color-swatch" style="background:${a.color}"></span>${a.color} | RGBA: ${a.rgba}<br>位置: (${a.realX}, ${a.realY})`;
}

function formatScanPreview(s) {
  let html = `检测到 ${s.totalBreaks} 个颜色突变行<br><br>`;
  html += `<div class="section">区域分割</div>`;
  s.regions.forEach((r, i) => {
    html += `区域${i+1}: y=${r.y1}-${r.y2} (高${r.height}px)<br>`;
  });
  return html;
}

// ========== 绘制 ==========
function clearOverlay() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
}

function drawCrosshair() {
  clearOverlay();
  drawAnnotations();
  overlayCtx.strokeStyle = 'rgba(233,69,96,0.4)';
  overlayCtx.lineWidth = 1;
  overlayCtx.setLineDash([4, 4]);
  overlayCtx.beginPath();
  overlayCtx.moveTo(0, mouseY);
  overlayCtx.lineTo(overlayCanvas.width, mouseY);
  overlayCtx.moveTo(mouseX, 0);
  overlayCtx.lineTo(mouseX, overlayCanvas.height);
  overlayCtx.stroke();
  overlayCtx.setLineDash([]);
  
  const rx = Math.round(mouseX / zoom);
  const ry = Math.round(mouseY / zoom);
  overlayCtx.fillStyle = 'rgba(233,69,96,0.9)';
  overlayCtx.fillRect(mouseX + 8, mouseY + 8, 70, 20);
  overlayCtx.fillStyle = '#fff';
  overlayCtx.font = '11px monospace';
  overlayCtx.fillText(`${rx},${ry}`, mouseX + 14, mouseY + 22);
}

function drawSelection() {
  clearOverlay();
  drawAnnotations();
  
  const x = Math.min(startX, endX);
  const y = Math.min(startY, endY);
  const w = Math.abs(endX - startX);
  const h = Math.abs(endY - startY);
  
  overlayCtx.fillStyle = 'rgba(233,69,96,0.08)';
  overlayCtx.fillRect(x, y, w, h);
  
  overlayCtx.strokeStyle = '#e94560';
  overlayCtx.lineWidth = 2;
  overlayCtx.strokeRect(x, y, w, h);
  
  // 四角标记
  const corner = 10;
  overlayCtx.strokeStyle = '#4ecca3';
  overlayCtx.lineWidth = 2;
  [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy]) => {
    overlayCtx.beginPath();
    overlayCtx.moveTo(cx - corner, cy);
    overlayCtx.lineTo(cx + corner, cy);
    overlayCtx.moveTo(cx, cy - corner);
    overlayCtx.lineTo(cx, cy + corner);
    overlayCtx.stroke();
  });
  
  // 中心十字
  const cx = x + w/2, cy = y + h/2;
  overlayCtx.strokeStyle = 'rgba(78,204,163,0.6)';
  overlayCtx.lineWidth = 1;
  overlayCtx.setLineDash([3, 3]);
  overlayCtx.beginPath();
  overlayCtx.moveTo(x, cy); overlayCtx.lineTo(x + w, cy);
  overlayCtx.moveTo(cx, y); overlayCtx.lineTo(cx, y + h);
  overlayCtx.stroke();
  overlayCtx.setLineDash([]);
  
  // 尺寸标签
  const rw = Math.round(w / zoom);
  const rh = Math.round(h / zoom);
  const label = `${rw} × ${rh}`;
  overlayCtx.font = 'bold 13px monospace';
  const tw = overlayCtx.measureText(label).width;
  overlayCtx.fillStyle = 'rgba(233,69,96,0.95)';
  overlayCtx.fillRect(x + w + 6, y, tw + 12, 22);
  overlayCtx.fillStyle = '#fff';
  overlayCtx.fillText(label, x + w + 12, y + 15);
  
  // 位置标签
  const rx = Math.round(x / zoom);
  const ry = Math.round(y / zoom);
  const posLabel = `(${rx}, ${ry})`;
  overlayCtx.font = '11px monospace';
  const tw2 = overlayCtx.measureText(posLabel).width;
  overlayCtx.fillStyle = 'rgba(15,52,96,0.95)';
  overlayCtx.fillRect(x, y - 20, tw2 + 10, 18);
  overlayCtx.fillStyle = '#4ecca3';
  overlayCtx.fillText(posLabel, x + 5, y - 7);
}

function drawAnnotations() {
  annotations.forEach((a, i) => {
    if (a.type === 'measure') {
      const x = a.x * zoom;
      const y = a.y * zoom;
      const w = a.width * zoom;
      const h = a.height * zoom;
      
      overlayCtx.strokeStyle = '#4ecca3';
      overlayCtx.lineWidth = 1.5;
      overlayCtx.setLineDash([6, 3]);
      overlayCtx.strokeRect(x, y, w, h);
      overlayCtx.setLineDash([]);
      
      // 内容边界（如果有）
      if (a.contentBounds) {
        const cx = a.contentBounds.x * zoom;
        const cy = a.contentBounds.y * zoom;
        const cw = a.contentBounds.width * zoom;
        const ch = a.contentBounds.height * zoom;
        overlayCtx.strokeStyle = '#e94560';
        overlayCtx.lineWidth = 1;
        overlayCtx.setLineDash([2, 2]);
        overlayCtx.strokeRect(cx, cy, cw, ch);
        overlayCtx.setLineDash([]);
      }
      
      overlayCtx.fillStyle = '#4ecca3';
      overlayCtx.fillRect(x, y - 16, 28, 16);
      overlayCtx.fillStyle = '#0d1117';
      overlayCtx.font = 'bold 11px monospace';
      overlayCtx.fillText(`#${i + 1}`, x + 4, y - 4);
    } else if (a.type === 'color') {
      overlayCtx.strokeStyle = '#e94560';
      overlayCtx.lineWidth = 2;
      overlayCtx.beginPath();
      overlayCtx.arc(a.x * zoom, a.y * zoom, 6, 0, Math.PI * 2);
      overlayCtx.stroke();
      overlayCtx.fillStyle = a.color;
      overlayCtx.beginPath();
      overlayCtx.arc(a.x * zoom, a.y * zoom, 3, 0, Math.PI * 2);
      overlayCtx.fill();
      
      overlayCtx.fillStyle = '#e94560';
      overlayCtx.fillRect(a.x * zoom + 10, a.y * zoom - 16, 28, 16);
      overlayCtx.fillStyle = '#fff';
      overlayCtx.font = 'bold 11px monospace';
      overlayCtx.fillText(`#${i + 1}`, a.x * zoom + 14, a.y * zoom - 4);
    }
  });
}

// ========== 命名 ==========
function showNameInput(defaultName, previewHtml) {
  const overlay = document.getElementById('nameOverlay');
  const input = document.getElementById('nameInput');
  const preview = document.getElementById('namePreview');
  overlay.classList.add('show');
  input.value = defaultName || '';
  preview.innerHTML = previewHtml || '';
  input.focus();
  input.select();
}

function confirmName() {
  if (!pendingAnnotation) return;
  const name = document.getElementById('nameInput').value.trim() || `标注${annotations.length + 1}`;
  pendingAnnotation.name = name;
  annotations.push(pendingAnnotation);
  pendingAnnotation = null;
  document.getElementById('nameOverlay').classList.remove('show');
  renderAnnotations();
  drawAnnotations();
  clearOverlay();
  drawAnnotations();
  showToast(`已添加: ${name}`);
}

function cancelName() {
  pendingAnnotation = null;
  document.getElementById('nameOverlay').classList.remove('show');
  clearOverlay();
  drawAnnotations();
}

document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') confirmName();
  if (e.key === 'Escape') cancelName();
});

// ========== 标注列表 ==========
function renderAnnotations() {
  const list = document.getElementById('annoList');
  document.getElementById('annoCount').textContent = annotations.length;
  
  if (annotations.length === 0) {
    list.innerHTML = '<p style="padding:16px;color:#555;font-size:12px;text-align:center">暂无标注，请在图片上框选或取色</p>';
    return;
  }
  
  list.innerHTML = annotations.map((a, i) => {
    if (a.type === 'measure') {
      let html = `<div class="annotation-item" onmouseenter="highlightAnno(${i})" onmouseleave="drawAnnotations()">`;
      html += `<div class="name"><span><span style="color:#4ecca3">#${i+1}</span> ${a.name}</span><span class="del" onclick="delAnno(${i})">×</span></div>`;
      html += `<div class="data">`;
      html += `<span class="key">位置:</span> ${a.x}, ${a.y} | <span class="key">尺寸:</span> ${a.width}×${a.height}px | <span class="key">比例:</span> ${a.aspectRatio}<br>`;
      
      if (a.contentBounds) {
        html += `<span class="key">内容:</span> ${a.contentBounds.width}×${a.contentBounds.height} @ (${a.contentBounds.x},${a.contentBounds.y})<br>`;
        html += `<span class="key">padding:</span> T=${a.contentBounds.padding.top} R=${a.contentBounds.padding.right} B=${a.contentBounds.padding.bottom} L=${a.contentBounds.padding.left}<br>`;
      }
      
      html += `<div class="section">🎨 主色调</div>`;
      a.palette.forEach(c => {
        html += `<div class="color-line"><span class="color-swatch" style="background:${c.hex}"></span>${c.hex} <span class="pct">${c.ratio}</span></div>`;
      });
      
      html += `<div class="section">🏳️ 背景色</div>`;
      html += `<span class="color-swatch" style="background:${a.bgColor}"></span>${a.bgColor}<br>`;
      
      if (a.cornerRadius.detected) {
        html += `<div class="section">🔄 圆角</div>`;
        html += `半径≈${a.cornerRadius.radius}px (${a.cornerRadius.uniform ? '统一' : '不统一'})<br>`;
      }
      
      if (a.border.detected) {
        html += `<div class="section">🔲 边框</div>`;
        html += `宽=${a.border.topWidth}px 色=<span class="color-swatch" style="background:${a.border.color}"></span>${a.border.color}<br>`;
      }
      
      if (a.gradient.detected) {
        html += `<div class="section">🌈 渐变(${a.gradient.direction})</div>`;
        html += `<span class="color-swatch" style="background:${a.gradient.from}"></span>${a.gradient.from} → <span class="color-swatch" style="background:${a.gradient.to}"></span>${a.gradient.to}<br>`;
      }
      
      if (a.textFeature.hasContent) {
        html += `<div class="section">📝 内容${a.textFeature.likelyText ? '(疑似文字)' : ''}</div>`;
        html += `占比=${a.textFeature.contentRatio}<br>`;
        a.textFeature.contentColors.forEach(c => {
          html += `<span class="color-swatch" style="background:${c.hex}"></span>${c.hex}(${c.ratio}) `;
        });
        if (a.textFeature.contentColors.length > 0) html += '<br>';
      }
      
      html += `<div class="section">💡 亮度</div>`;
      html += `avg=${a.brightness.average} (${a.brightness.level}) | min=${a.brightness.min} max=${a.brightness.max}<br>`;
      
      html += `<div class="section">🔀 对称性</div>`;
      html += `水平=${a.symmetry.horizontal} 垂直=${a.symmetry.vertical}<br>`;
      
      html += `<div class="section">📊 分布</div>`;
      html += `背景=${a.colorDistribution.bgRatio} 前景=${a.colorDistribution.fgRatio} | 主色相=${a.colorDistribution.dominantHue}<br>`;
      
      html += `</div></div>`;
      return html;
    } else if (a.type === 'color') {
      return `<div class="annotation-item" onmouseenter="highlightAnno(${i})" onmouseleave="drawAnnotations()">
        <div class="name"><span><span style="color:#e94560">#${i+1}</span> ${a.name}</span><span class="del" onclick="delAnno(${i})">×</span></div>
        <div class="data">
          <span class="key">位置:</span> ${a.realX}, ${a.realY}<br>
          <span class="key">颜色:</span> <span class="color-swatch" style="background:${a.color}"></span>${a.color}<br>
          <span class="key">RGBA:</span> ${a.rgba}
        </div>
      </div>`;
    } else if (a.type === 'scan') {
      let html = `<div class="annotation-item">`;
      html += `<div class="name"><span><span style="color:#e94560">#${i+1}</span> ${a.name}</span><span class="del" onclick="delAnno(${i})">×</span></div>`;
      html += `<div class="data">`;
      html += `检测到 ${a.totalBreaks} 个颜色突变行<br>`;
      a.regions.forEach((r, j) => {
        html += `区域${j+1}: y=${r.y1}-${r.y2} (高${r.height}px)<br>`;
      });
      html += `</div></div>`;
      return html;
    }
  }).join('');
}

function highlightAnno(i) {
  clearOverlay();
  drawAnnotations();
  const a = annotations[i];
  if (!a || a.type !== 'measure') return;
  
  const x = a.x * zoom;
  const y = a.y * zoom;
  const w = a.width * zoom;
  const h = a.height * zoom;
  overlayCtx.fillStyle = 'rgba(78,204,163,0.12)';
  overlayCtx.fillRect(x, y, w, h);
  overlayCtx.strokeStyle = '#4ecca3';
  overlayCtx.lineWidth = 3;
  overlayCtx.strokeRect(x, y, w, h);
  
  // 内容边界高亮
  if (a.contentBounds) {
    const cx = a.contentBounds.x * zoom;
    const cy = a.contentBounds.y * zoom;
    const cw = a.contentBounds.width * zoom;
    const ch = a.contentBounds.height * zoom;
    overlayCtx.strokeStyle = '#e94560';
    overlayCtx.lineWidth = 2;
    overlayCtx.setLineDash([4, 2]);
    overlayCtx.strokeRect(cx, cy, cw, ch);
    overlayCtx.setLineDash([]);
  }
}

function delAnno(i) {
  annotations.splice(i, 1);
  renderAnnotations();
  drawAnnotations();
}

function clearAll() {
  if (annotations.length === 0) return;
  if (!confirm('确认清空所有标注？')) return;
  annotations = [];
  renderAnnotations();
  drawAnnotations();
}

// ========== 导出 ==========
function exportJSON() {
  if (annotations.length === 0) { showToast('暂无标注数据'); return; }
  const data = JSON.stringify(annotations, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ui-annotations-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 JSON 文件');
}

function copyJSON() {
  if (annotations.length === 0) { showToast('暂无标注数据'); return; }
  const data = JSON.stringify(annotations, null, 2);
  navigator.clipboard.writeText(data).then(() => {
    showToast('已复制到剪贴板');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = data;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  });
}

// ========== UI 辅助 ==========
function showAnalyzing(text) {
  document.getElementById('analyzingText').textContent = text || '分析中...';
  document.getElementById('analyzing').classList.add('show');
}
function hideAnalyzing() {
  document.getElementById('analyzing').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
