[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# API 路由：转发到 Netlify Functions
[[redirects]]
  from = "/api/questions"
  to = "/.netlify/functions/questions"
  status = 200
  force = true

[[redirects]]
  from = "/api/accounts/*"
  to = "/.netlify/functions/accounts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-analysis"
  to = "/.netlify/functions/generate-analysis"
  status = 200
  force = true

# SPA 路由回退：非文件、非 API 路径返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
