[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ponytail: index.html 禁止缓存，确保用户始终拿到最新版本引用
# ceiling: 带hash的JS/CSS由Vite自动hash化，可长期缓存；index.html必须每次拉新
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Service Worker 与 manifest 必须每次拉新，否则新版 SW 无法生效
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"

# API 路由：转发到 Netlify Functions（优先于 SPA 回退）
[[redirects]]
  from = "/api/questions"
  to = "/.netlify/functions/questions"
  status = 200
  force = true

[[redirects]]
  from = "/api/accounts/*"
  to = "/.netlify/functions/accounts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-analysis"
  to = "/.netlify/functions/generate-analysis"
  status = 200
  force = true

# SPA 路由回退：非文件、非 API 路径返回 index.html
# force = false 确保已存在的静态资源优先
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
